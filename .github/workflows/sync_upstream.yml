name: Sync with upstream and release

# Merges new commits from thomasloven/hass-plejd into master once a day and
# publishes a release whenever the integration version changes, so HACS
# offers the update on "Plejd 2.0" without reinstalling (entities are kept).
#
# Release tags map upstream X.Y.Z to v.(X+2).Y.Z, e.g. 0.22.1 -> v.2.22.1,
# so they always sort above the fork's earlier v.2.0.0 release.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM: https://github.com/thomasloven/hass-plejd.git
      UPSTREAM_BRANCH: master
      HACS_NAME: Plejd 2.0
      GH_TOKEN: ${{ github.token }}
      # Keep gh on this fork; it otherwise picks the "upstream" remote.
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream
        id: merge
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Already up to date with upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge --no-edit "upstream/$UPSTREAM_BRANCH"; then
            conflicts=$(git diff --name-only --diff-filter=U)
            echo "Conflicting files: $conflicts"

            if [ "$conflicts" != "hacs.json" ]; then
              echo "::error::Merge conflict outside hacs.json, resolve manually: $conflicts"
              git merge --abort
              exit 1
            fi

            # Take upstream's hacs.json but keep the fork's display name.
            git checkout --theirs hacs.json
            jq --arg name "$HACS_NAME" '.name = $name' hacs.json > hacs.json.tmp
            mv hacs.json.tmp hacs.json
            git add hacs.json
            git commit --no-edit
          fi

          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Release new version
        run: |
          version=$(jq -r .version custom_components/plejd/manifest.json)
          major=${version%%.*}
          rest=${version#*.}
          tag="v.$((major + 2)).${rest}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi

          gh release create "$tag" \
            --target "$(git rev-parse HEAD)" \
            --title "$tag (upstream $version)" \
            --notes "Automatically synced with thomasloven/hass-plejd $version. See upstream for changes: https://github.com/thomasloven/hass-plejd/commits/$UPSTREAM_BRANCH"
